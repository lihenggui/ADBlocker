org.gradle.jvmargs=-Xmx3g -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true
org.gradle.configuration-cache=true
android.useAndroidX=true
android.nonTransitiveRClass=true
appLocales=en,zh,b+zh+Hant,ru,es,pt-rBR,in,vi,tr,ja
kotlin.code.style=official
# Screenshot tests compare with the checked-in images as part of `test`, as in
# Blocker; `./gradlew recordRoborazziDebug` records them anew.
roborazzi.test.verify=true
# R8 optimizes differently with one thread than with more, so a release
# built again on a machine with one processor (F-Droid's) would differ from
# it. A fixed pool gives every machine the same result.
android.r8.threadPoolSize=4
