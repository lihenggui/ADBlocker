[workspace]

[package]
name = "abd-fuzz"
version = "0.0.0"
edition = "2024"
license = "GPL-3.0-only"
publish = false

[package.metadata]
cargo-fuzz = true

[dependencies]
abd-engine = { path = "../abd-engine", features = ["fuzzing"] }
abd-vpn = { path = "../abd-vpn", features = ["fuzzing"] }
libfuzzer-sys = "0.4.13"

