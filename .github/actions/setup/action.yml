name: Set up the build environment
description: >
  Sets up Rust stable, a JDK and Gradle. The Android SDK and NDK come
  with the runner image.

runs:
  using: composite
  steps:
    - name: Install the Rust toolchain
      shell: bash
      run: |
        rustup toolchain install stable --profile minimal \
          --component rustfmt,clippy \
          --target aarch64-linux-android --target x86_64-linux-android
        rustup default stable

    - name: Cache Rust build output
      uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3

    # scripts/build.sh uses $ANDROID_NDK_HOME as it is; the image points it at
    # an older NDK than the newest one it carries.
    - name: Select the newest NDK
      shell: bash
      run: echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >>"$GITHUB_ENV"

    - name: Set up the JDK
      uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
      with:
        distribution: temurin
        java-version: 21

    - name: Set up Gradle
      uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1
